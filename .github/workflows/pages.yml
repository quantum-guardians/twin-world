name: Deploy to GitHub Pages

# Pages was serving the repository root as-is, which meant browsers received
# Vite's source entry (`/src/main.tsx`) instead of a bundle - see issue #15.
# This builds the app and publishes `dist/` instead. Requires the repository's
# Pages source to be set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so a merged commit
# is not dropped mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vite copies public/ into dist/, but CNAME lives at the repository root
      # (added through the GitHub UI), so carry it over explicitly or the
      # custom domain is dropped on the first Actions deploy.
      - run: cp CNAME dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
